name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push baru ke cabang yang sama membatalkan proses lama yang belum selesai.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Logika inti (uang, alokasi, nisab, haul, entitlement) diuji di JVM tanpa emulator.
      - name: Unit test semua modul
        run: ./gradlew test

      # Memastikan seluruh modul, termasuk Room dan Compose, tetap bisa dibangun.
      - name: Build APK debug
        run: ./gradlew :app:assembleDebug

      # Skema Room yang berubah wajib ikut di-commit (data/schemas), supaya migrasinya bisa diuji.
      - name: Berkas skema Room sudah ter-commit
        run: test -z "$(git status --porcelain -- data/schemas)"

      - name: Simpan laporan tes bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-tes
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Simpan APK debug
        uses: actions/upload-artifact@v4
        with:
          name: rizqflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
